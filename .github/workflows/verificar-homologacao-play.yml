name: Verificar servidor de teste interno da Google Play
on:
  push:
    branches: [release/play-console-preparacao]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validar que homologacao nao e producao
        shell: bash
        run: |
          set -euo pipefail
          TEST_URL="https://obraponto-play-homologacao-homologacao.up.railway.app"
          PROD_URL="https://obraponto-servidor-production.up.railway.app"
          test "$TEST_URL" != "$PROD_URL"
          for attempt in {1..12}; do
            if curl -fsS --connect-timeout 6 --max-time 12 "$TEST_URL/api/health" -o /tmp/health; then break; fi
            sleep 5
          done
          node -e 'let h=require("/tmp/health");if(h.status!=="ok") process.exit(1); console.log("Saude da homologacao: OK")'
      - name: Verificar painéis Empresa e Funcionário
        shell: bash
        run: |
          set -euo pipefail
          TEST_URL="https://obraponto-play-homologacao-homologacao.up.railway.app"
          curl -fLsS --connect-timeout 8 --max-time 20 "$TEST_URL/admin/" -o /tmp/admin.html
          curl -fLsS --connect-timeout 8 --max-time 20 "$TEST_URL/funcionario/" -o /tmp/worker.html
          grep -qi obraponto /tmp/admin.html
          grep -qi obraponto /tmp/worker.html
          echo "Ambos os paineis acessiveis sem credenciais reais"
      - name: Verificar bloqueio de acesso nao autenticado
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/noauth -w "%{http_code}" https://obraponto-play-homologacao-homologacao.up.railway.app/api/admin/workers)
          test "$code" = 401
          echo "API bloqueou acesso anonimo com HTTP 401"
