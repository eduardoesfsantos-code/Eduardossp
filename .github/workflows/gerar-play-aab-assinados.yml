name: Gerar AABs ASSINADOS para Google Play
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  OBRAPONTO_SAAS_BASE_URL: ${{ vars.OBRAPONTO_SAAS_BASE_URL }}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clonar o projeto
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verificar destino comercial antes de assinar
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OBRAPONTO_SAAS_BASE_URL" || { echo "Configure a variável de repositório OBRAPONTO_SAAS_BASE_URL"; exit 1; }
          [[ "$OBRAPONTO_SAAS_BASE_URL" == https://* ]] || { echo "Domínio SaaS deve usar HTTPS"; exit 1; }
          [[ "$OBRAPONTO_SAAS_BASE_URL" != *obraponto-servidor-production.up.railway.app* ]] || { echo "Não publique apontando para o servidor legado monoempresa"; exit 1; }
          [[ "$OBRAPONTO_SAAS_BASE_URL" != *obraponto-play-homologacao-homologacao.up.railway.app* ]] || { echo "Não publique apontando para a homologação monoempresa"; exit 1; }
          test "${{ github.event.repository.private }}" = true || { echo "Repositório público: não gerar artefatos comerciais assinados neste fluxo."; exit 1; }
      - name: Preparar chaves privadas de upload
        shell: bash
        env:
          EMPRESA_KEY: ${{ secrets.OBRAPONTO_EMPRESA_KEYSTORE_B64 }}
          FUNC_KEY: ${{ secrets.OBRAPONTO_FUNCIONARIO_KEYSTORE_B64 }}
          EPASS: ${{ secrets.OBRAPONTO_EMPRESA_STORE_PASSWORD }}
          EALIAS: ${{ secrets.OBRAPONTO_EMPRESA_KEY_ALIAS }}
          EKPASS: ${{ secrets.OBRAPONTO_EMPRESA_KEY_PASSWORD }}
          FPASS: ${{ secrets.OBRAPONTO_FUNCIONARIO_STORE_PASSWORD }}
          FALIAS: ${{ secrets.OBRAPONTO_FUNCIONARIO_KEY_ALIAS }}
          FKP: ${{ secrets.OBRAPONTO_FUNCIONARIO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$EMPRESA_KEY" && test -n "$FUNC_KEY"
          test -n "$EPASS" && test -n "$EALIAS" && test -n "$EKPASS"
          test -n "$FPASS" && test -n "$FALIAS" && test -n "$FKP"
          umask 077
          printf '%s' "$EMPRESA_KEY" | base64 -d > "$RUNNER_TEMP/empresa-upload.jks"
          printf '%s' "$FUNC_KEY" | base64 -d > "$RUNNER_TEMP/funcionario-upload.jks"
          test -s "$RUNNER_TEMP/empresa-upload.jks" && test -s "$RUNNER_TEMP/funcionario-upload.jks"
      - name: AAB assinado Empresa
        shell: bash
        env:
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/empresa-upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.OBRAPONTO_EMPRESA_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.OBRAPONTO_EMPRESA_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.OBRAPONTO_EMPRESA_KEY_PASSWORD }}
        run: gradle -p obraponto_android/ObraPonto_Empresa_Android --no-daemon bundleRelease
      - name: AAB assinado Funcionário
        shell: bash
        env:
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/funcionario-upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.OBRAPONTO_FUNCIONARIO_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.OBRAPONTO_FUNCIONARIO_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.OBRAPONTO_FUNCIONARIO_KEY_PASSWORD }}
        run: gradle -p obraponto_android/ObraPonto_Funcionario_Android --no-daemon bundleRelease
      - name: Verificar assinaturas dos bundles
        shell: bash
        run: |
          set -euo pipefail
          A=obraponto_android/ObraPonto_Empresa_Android/app/build/outputs/bundle/release/app-release.aab
          B=obraponto_android/ObraPonto_Funcionario_Android/app/build/outputs/bundle/release/app-release.aab
          test -s "$A" && test -s "$B"
          jarsigner -verify "$A" > /tmp/obraponto-a.log 2>&1
          jarsigner -verify "$B" > /tmp/obraponto-b.log 2>&1
          grep -qi "jar verified" /tmp/obraponto-a.log || { echo "Bundle Empresa sem assinatura validada"; exit 1; }
          grep -qi "jar verified" /tmp/obraponto-b.log || { echo "Bundle Funcionario sem assinatura validada"; exit 1; }
          # Comparar com os certificados de upload aceitos anteriormente no Play.
          EA=$(keytool -J-Duser.language=en -J-Duser.country=US -printcert -jarfile "$A" | awk '/SHA256:/{print $2;exit}')
          FA=$(keytool -J-Duser.language=en -J-Duser.country=US -printcert -jarfile "$B" | awk '/SHA256:/{print $2;exit}')
          [[ "$EA" == "02:0E:C9:43:32:12:02:37:F7:D4:9E:98:2D:68:9E:07:C8:4A:34:5C:C8:94:40:6E:5B:DF:9E:3A:5E:7D:37:E8" ]] || { echo "Certificado Empresa diferente do original"; exit 1; }
          [[ "$FA" == "76:1B:BF:A7:58:64:6E:96:6A:B0:2D:5B:2F:DE:83:16:B3:C9:F0:5B:0B:CB:47:36:3D:E3:C8:6C:89:2F:3B:BD" ]] || { echo "Certificado Funcionário diferente do original"; exit 1; }
          echo "Assinaturas e certificados originais verificados com sucesso"
      - name: Publicar AABs para download privado
        uses: actions/upload-artifact@v4
        with:
          name: ObraPonto-AABs-ASSINADOS-1.4.0
          path: |
            obraponto_android/ObraPonto_Empresa_Android/app/build/outputs/bundle/release/app-release.aab
            obraponto_android/ObraPonto_Funcionario_Android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
