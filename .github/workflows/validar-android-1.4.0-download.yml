name: Validar pacotes Android 1.4.0
on:
  push:
    branches: [feature/android-1.4.0-download-final]
  pull_request:
    branches: [release/android-1.4.0-rc1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [Empresa, Funcionario]
    defaults:
      run:
        working-directory: obraponto_android/ObraPonto_${{ matrix.app }}_Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK de teste e AAB sem assinatura
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Conferir pacotes
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: ObraPonto-${{ matrix.app }}-1.4.0-validacao
          path: |
            obraponto_android/ObraPonto_${{ matrix.app }}_Android/app/build/outputs/apk/debug/app-debug.apk
            obraponto_android/ObraPonto_${{ matrix.app }}_Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
