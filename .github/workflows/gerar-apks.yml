name: Gerar APKs de teste do ObraPonto
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android 35
        run: |
          echo "Android SDK: ${ANDROID_HOME:-nao definido}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager nao encontrado no ambiente Android" >&2
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar ObraPonto Empresa
        run: gradle -p obraponto_android/ObraPonto_Empresa_Android --no-daemon assembleDebug

      - name: Compilar ObraPonto Funcionario
        run: gradle -p obraponto_android/ObraPonto_Funcionario_Android --no-daemon assembleDebug

      - name: Disponibilizar APK Empresa
        uses: actions/upload-artifact@v4
        with:
          name: ObraPonto-Empresa-APK
          path: obraponto_android/ObraPonto_Empresa_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Disponibilizar APK Funcionario
        uses: actions/upload-artifact@v4
        with:
          name: ObraPonto-Funcionario-APK
          path: obraponto_android/ObraPonto_Funcionario_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
