name: Validar ObraPonto Comercial V2
on:
  push:
    branches: [develop/obraponto-comercial-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        working-directory: obraponto_android/ObraPonto_Servidor_Central
        run: npm install --no-audit --no-fund
      - name: Validar API e compilar painéis
        working-directory: obraponto_android/ObraPonto_Servidor_Central
        run: npm run check
      - name: Testar API, dados e exportações com banco temporário
        working-directory: obraponto_android/ObraPonto_Servidor_Central
        run: node tests/v2-integration.mjs
      - name: Testar migração do banco antigo e backup
        working-directory: obraponto_android/ObraPonto_Servidor_Central
        run: node tests/v2-migration.mjs
