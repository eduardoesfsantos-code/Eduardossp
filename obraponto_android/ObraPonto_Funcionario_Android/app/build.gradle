plugins { id 'com.android.application' }
android {
    buildFeatures { buildConfig true }
    namespace 'com.obraponto.funcionario'
    compileSdk 36
    defaultConfig {
        applicationId 'com.obraponto.funcionario'
        minSdk 24
        targetSdk 36
        // Nunca embutir o servidor legado de uma empresa nos apps comerciais.
        // Sem URL SaaS, o aplicativo solicita o endereco ao abrir.
        def saasUrl = (System.getenv('OBRAPONTO_SAAS_BASE_URL') ?: '').trim()
        if (saasUrl && !(saasUrl ==~ /^https:\/\/[a-zA-Z0-9.-]+(:[0-9]{2,5})?$/)) {
            throw new GradleException('OBRAPONTO_SAAS_BASE_URL deve ser URL HTTPS sem caminho.')
        }
        buildConfigField 'String', 'DEFAULT_ORIGIN', '"'+saasUrl+'"'
        versionCode 130
        versionName '1.3.0'
    }

    // Assinatura de publicação exclusivamente por variáveis protegidas do CI.
    // Quando ausentes, continua possível gerar AAB sem assinatura para validação.
    signingConfigs {
        release {
            def keyPath = System.getenv('UPLOAD_KEYSTORE_FILE')
            if (keyPath && System.getenv('UPLOAD_KEYSTORE_PASSWORD') &&
                System.getenv('UPLOAD_KEY_ALIAS') && System.getenv('UPLOAD_KEY_PASSWORD')) {
                storeFile file(keyPath)
                storePassword System.getenv('UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('UPLOAD_KEYSTORE_FILE') && System.getenv('UPLOAD_KEYSTORE_PASSWORD') &&
                System.getenv('UPLOAD_KEY_ALIAS') && System.getenv('UPLOAD_KEY_PASSWORD')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
